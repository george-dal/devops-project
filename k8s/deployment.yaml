apiVersion: apps/v1
kind: Deployment
metadata:
  name: military-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: military-service
  template:
    metadata:
      labels:
        app: military-service
    spec:
      containers:
      - name: fastapi-app
        image: fastapi-app:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: military-service-svc
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: military-service